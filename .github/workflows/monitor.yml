name: Tor Watch Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: 02:17, 08:17, 14:17, 20:17 JST.
    - cron: "17 */6 * * *"

concurrency:
  group: tor-watch-public-osint
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tor
        run: sudo apt-get update && sudo apt-get install -y tor
      - name: Start Tor
        run: sudo systemctl start tor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m torwatch.cli --run
      - name: Persist monitoring state
        run: python scripts/persist_history.py
