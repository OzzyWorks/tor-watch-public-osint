name: Tor Watch Monitor

on:
  workflow_dispatch:

concurrency:
  group: tor-watch-public-osint
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tor
        run: sudo apt-get update && sudo apt-get install -y tor
      - name: Start Tor
        run: sudo systemctl start tor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m torwatch.cli --run
      - name: Commit history
        run: |
          git config user.name "tor-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update monitoring history [skip ci]"
            git pull --rebase origin main
            git push
          fi
