name: Publish Tor Watch Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      slack_test:
        description: "Send a one-time Slack webhook test message"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "15 */6 * * *"

concurrency:
  group: tor-watch-public-osint
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tor
        run: sudo apt-get update && sudo apt-get install -y tor
      - name: Start Tor and wait for bootstrap
        run: |
          sudo systemctl start tor
          for i in $(seq 1 60); do
            if sudo journalctl -u tor --no-pager -n 100 | grep -q "Bootstrapped 100%"; then
              echo "Tor bootstrap completed"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Tor did not bootstrap within 5 minutes"
              sudo journalctl -u tor --no-pager -n 150
              exit 1
            fi
            sleep 5
          done
          for i in $(seq 1 20); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/9050' 2>/dev/null; then
              echo "Tor SOCKS5 port is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Tor SOCKS5 port is not listening"
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Test Slack webhook (push verification or manual opt-in)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.slack_test)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m torwatch.cli --test-slack
      - name: Monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m torwatch.cli --run
      - name: Persist monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.db
          if git diff --cached --quiet; then
            echo "Monitoring database unchanged"
          else
            git commit -m "Persist Tor Watch monitoring state [skip ci]"
            git push
          fi
      - name: Export web data
        run: python scripts/export_web.py
      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
