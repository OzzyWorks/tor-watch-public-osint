name: Publish Tor Watch Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      slack_test:
        description: "Send a one-time Slack webhook test message"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "15 */6 * * *"

concurrency:
  group: tor-watch-public-osint
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tor
        run: sudo apt-get update && sudo apt-get install -y tor
      - name: Start Tor
        run: sudo systemctl start tor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Test Slack webhook (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.slack_test
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m torwatch.cli --test-slack
      - name: Monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m torwatch.cli --run
      - name: Export web data
        run: python scripts/export_web.py
      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
